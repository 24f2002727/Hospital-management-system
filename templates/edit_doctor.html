{% extends 'base.html' %}
{% block content %}
<div class="form-shell">
    <div class="form-panel">
        <p class="eyebrow">Doctor #{{ doctor.id }}</p>
        <h1>Edit Doctor Details</h1>
                    <form action="{{ url_for('edit_doctor', doctor_id=doctor.id) }}" method="post">
                        <fieldset class="mb-4">
                            <legend class="fs-6 mb-3">Personal Information</legend>
                            
                            <div class="form-group">
                                <label for="name" class="form-label">Full Name</label>
                                <input type="text" id="name" name="name" class="form-control" value="{{ doctor.name }}" required>
                            </div>

                            <div class="form-group">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" id="email" name="email" class="form-control" value="{{ doctor.email }}" required>
                            </div>

                            <div class="form-group">
                                <label for="contact" class="form-label">Contact</label>
                                <input type="tel" id="contact" name="contact" class="form-control" value="{{ doctor.contact }}" required>
                            </div>

                            <div class="form-group">
                                <label for="specialization" class="form-label">Specialization</label>
                                <input type="text" id="specialization" name="specialization" class="form-control" value="{{ doctor.specialization or '' }}" placeholder="e.g., Cardiology, Orthopedics">
                            </div>
                        </fieldset>

                        <fieldset class="mb-4">
                            <legend class="fs-6 mb-3">Assignment Details</legend>
                            
                            <div class="form-group">
                                <label for="dept_id" class="form-label">Department</label>
                                <select id="dept_id" name="dept_id" class="form-select" required>
                                    {% for department in departments %}
                                    <option value="{{ department.id }}" {% if doctor.dept_id == department.id %}selected{% endif %}>{{ department.name }} · {{ department.building }}</option>
                                    {% endfor %}
                                </select>
                            </div>

                            <div class="form-group">
                                <label for="availability" class="form-label">General Availability</label>
                                <input type="text" id="availability" name="availability" class="form-control" value="{{ doctor.availability or '' }}" placeholder="e.g., Mon-Fri, 10:00-16:00">
                            </div>

                            <div class="form-group">
                                <label for="status" class="form-label">Account Status</label>
                                <select name="status" id="status" class="form-select" required>
                                    <option value="active" {% if doctor.status == 'active' %}selected{% endif %}>Active</option>
                                    <option value="blocked" {% if doctor.status == 'blocked' %}selected{% endif %}>Blocked</option>
                                    <option value="removed" {% if doctor.status == 'removed' %}selected{% endif %}>Removed</option>
                                </select>
                            </div>
                        </fieldset>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-success flex-grow-1">Update Doctor</button>
                            <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary flex-grow-1">Cancel</a>
                        </div>
                    </form>
    </div>
</div>
{% endblock %}
