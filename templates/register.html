{% extends "base.html" %}
{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h2>Patient Registration</h2>
        <p class="text-center text-muted mb-3">Create your account to get started</p>
        <hr>
        
        <form action="/register" method="POST">
            <fieldset class="mb-4">
                <legend class="fs-6">Personal Information</legend>
                
                <div class="form-group">
                    <label for="name" class="form-label">Full Name</label>
                    <input type="text" id="name" name="name" class="form-control" placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label for="contact" class="form-label">Contact Number</label>
                    <input type="tel" id="contact" name="contact" class="form-control" placeholder="Enter your phone number" required>
                </div>
            </fieldset>

            <fieldset class="mb-4">
                <legend class="fs-6">Account Details</legend>
                
                <div class="form-group">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" id="username" name="username" class="form-control" placeholder="Choose a unique username" required>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="Enter a strong password" required>
                </div>
            </fieldset>

            <button type="submit" class="btn btn-success btn-block w-100 mb-3">Register Account</button>
        </form>

        <div class="auth-footer">
            <p>Already have an account?</p>
            <form action="{{ url_for('login') }}" method="get">
                <button type="submit" class="btn btn-primary btn-block w-100">Login Here</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
