{% extends "base.html" %}
{% block content %}

    <style>
        h1 {
            text-align: center;
            border: 3px solid black;
            border-radius: 10px;
            background-color: azure;
            width: 50vw;
            position: relative;
            left: 25vw;
        }

        #div1 {
            border: 3px solid black;
            border-radius: 10px;
            height: 500px;
            width: 400px;
            background-color: azure;
            position: relative;
            top: 10vh;
            left: 40vw;
            margin: 10px;
            padding: 10px;
            align-content: center;
            align-self: center;
        }

        .form {
            text-align: center;
            position: relative;
        }
    </style>
</head>

<body style="background-color: rgba(246, 26, 26, 0.309)"">
    <h1>Login portal page</h1>
    <hr >
    <div id=" div1">
    <form action="/login" method="POST">
        <h2 id="div_header">Login portal</h2>
        <select id="role" name="role">
            <option value="patient">Patient</option>
            <option value="doctor">Doctor</option>
            <option value="admin">Admin</option>
        </select>
        <br>
        <label for="username" class="form">Username</label>
        <br>
        <input type="text" id="username" name="username">
        <br>
        <label for="password">Password</label>
        <br>
        <input type="password" id="password" name="password">
        <br>
        <input type="submit" value="Login">
    </form>
    </div>
    <div>
        <form action="/register" meyhod="get">
            <p>New user?</p>
            <input type="submit" value="Register here">
        </form>
    </div>
{% endblock %}
