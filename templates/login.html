{% extends "base.html" %}
{% block content %}


<body>
    <h1>Login portal page</h1>
    <hr >
    <div id="div1">
        <div>
    <form action="/login" method="POST">
        <h2 id="div header">Login portal</h2>
        <select id="role" name="role" class="btn btn-warning">
            <option value="patient">Patient</option>
            <option value="doctor">Doctor</option>
            <option value="admin">Admin</option>
        </select>
        <br>
        <label for="username" class="form">Username</label>
        <br>
        <input type="text" id="username" name="username">
        <br>
        <label for="password">Password</label>
        <br>
        <input type="password" id="password" name="password">
        <br>
        <br>
        <input type="submit" id="login" class="btn btn-primary" value="Login">
    </form>
    </div>
    <div id="div2">
        <form action="/register" method="get">
            New user?
            <input type="submit"  id="register" class="btn btn-success" value="Register here">
        </form>
    </div>
    </div>
    
{% endblock %}
