{% extends "base.html" %}
{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h2>Login Portal</h2>
        <p class="text-center text-muted mb-3">Sign in to your account</p>
        <hr>
        
        <form action="/login" method="POST">
            <div class="form-group">
                <label for="role" class="form-label">Select Role</label>
                <select id="role" name="role" class="form-select" required>
                    <option value="">-- Select Your Role --</option>
                    <option value="patient">Patient</option>
                    <option value="doctor">Doctor</option>
                    <option value="admin">Administrator</option>
                </select>
            </div>

            <div class="form-group">
                <label for="username" class="form-label">Username</label>
                <input type="text" id="username" name="username" class="form-control" placeholder="Enter your username" required>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="btn btn-primary btn-block w-100 mt-3">Login</button>
        </form>

        <div class="auth-footer">
            <p>Don't have an account?</p>
            <form action="{{ url_for('register') }}" method="get">
                <button type="submit" class="btn btn-success btn-block w-100">Register Here</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
