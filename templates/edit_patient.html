{% extends 'base.html' %}
{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h2 class="mb-0">👥 Edit Patient Details</h2>
                    <small class="text-muted">Patient ID: #{{ patient.id }}</small>
                </div>
                <div class="card-body">
                    <form action="/edit_patient/{{ patient.id }}" method="post">
                        <fieldset class="mb-4">
                            <legend class="fs-6 mb-3">Personal Information</legend>
                            
                            <div class="form-group">
                                <label for="name" class="form-label">Full Name</label>
                                <input type="text" id="name" name="name" class="form-control" value="{{ patient.name }}" required>
                            </div>

                            <div class="form-group">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" id="email" name="email" class="form-control" value="{{ patient.email }}" required>
                            </div>

                            <div class="form-group">
                                <label for="contact" class="form-label">Contact</label>
                                <input type="tel" id="contact" name="contact" class="form-control" value="{{ patient.contact }}" required>
                            </div>

                            <div class="form-group">
                                <label for="date_of_birth" class="form-label">Date of Birth</label>
                                <input type="date" id="date_of_birth" name="date_of_birth" class="form-control" value="{{ patient.date_of_birth or '' }}">
                            </div>

                            <div class="form-group">
                                <label for="address" class="form-label">Address</label>
                                <textarea id="address" name="address" class="form-control" rows="3" placeholder="Enter your address">{{ patient.address or '' }}</textarea>
                            </div>
                        </fieldset>

                        <fieldset class="mb-4">
                            <legend class="fs-6 mb-3">Account Details</legend>
                            
                            <div class="form-group">
                                <label for="username" class="form-label">Username</label>
                                <input type="text" id="username" name="username" class="form-control" value="{{ patient.username }}" required>
                            </div>

                            {% if session.get('role') == 'admin' %}
                            <div class="form-group">
                                <label for="status" class="form-label">Account Status</label>
                                <select name="status" id="status" class="form-select" required>
                                    <option value="active" {% if patient.status == 'active' %}selected{% endif %}>Active</option>
                                    <option value="blocked" {% if patient.status == 'blocked' %}selected{% endif %}>Blocked</option>
                                    <option value="removed" {% if patient.status == 'removed' %}selected{% endif %}>Removed</option>
                                </select>
                            </div>
                            {% endif %}
                        </fieldset>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-success flex-grow-1">Update Patient</button>
                            <a href="{% if session.get('role') == 'admin' %}/admin_dashboard{% else %}/patient_dashboard{% endif %}" class="btn btn-secondary flex-grow-1">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
