{% extends 'base.html' %}
{% block content %}
<div class="form-shell">
    <div class="form-panel">
        <p class="eyebrow">Clinical Staff</p>
        <h1>Create New Doctor</h1>
                    <form action="{{ url_for('create_doctor') }}" method="POST">
                        <fieldset class="mb-4">
                            <legend class="fs-6 mb-3">Account Details</legend>
                            
                            <div class="form-group">
                                <label for="username" class="form-label">Username</label>
                                <input type="text" id="username" name="username" class="form-control" placeholder="Enter doctor's username" required>
                            </div>

                            <div class="form-group">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" id="password" name="password" class="form-control" placeholder="Enter secure password" required>
                            </div>
                        </fieldset>

                        <fieldset class="mb-4">
                            <legend class="fs-6 mb-3">Personal Details</legend>
                            
                            <div class="form-group">
                                <label for="name" class="form-label">Full Name</label>
                                <input type="text" id="name" name="name" class="form-control" placeholder="Enter doctor's full name" required>
                            </div>

                            <div class="form-group">
                                <label for="email" class="form-label">Email Address</label>
                                <input type="email" id="email" name="email" class="form-control" placeholder="Enter doctor's email" required>
                            </div>

                            <div class="form-group">
                                <label for="contact" class="form-label">Contact Number</label>
                                <input type="tel" id="contact" name="contact" class="form-control" placeholder="Enter phone number" required>
                            </div>

                            <div class="form-group">
                                <label for="specialization" class="form-label">Specialization</label>
                                <input type="text" id="specialization" name="specialization" class="form-control" placeholder="e.g., Cardiology, Orthopedics">
                            </div>

                            <div class="form-group">
                                <label for="dept_id" class="form-label">Department</label>
                                <select id="dept_id" name="dept_id" class="form-select" required>
                                    <option value="">Choose department</option>
                                    {% for department in departments %}
                                    <option value="{{ department.id }}">{{ department.name }} · {{ department.building }}</option>
                                    {% endfor %}
                                </select>
                            </div>

                            <div class="form-group">
                                <label for="availability" class="form-label">General Availability</label>
                                <input type="text" id="availability" name="availability" class="form-control" value="Mon-Fri, 10:00-16:00" placeholder="e.g., Mon-Fri, 10:00-16:00">
                            </div>
                        </fieldset>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-success flex-grow-1">Create Doctor</button>
                            <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary flex-grow-1">Cancel</a>
                        </div>
                    </form>
    </div>
</div>
{% endblock %}
