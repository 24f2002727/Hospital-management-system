{% extends "base.html" %}
{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h2 class="mb-0">🏥 Edit Department</h2>
                    <small class="text-muted">Department ID: #{{ department.id }}</small>
                </div>
                <div class="card-body">
                    <form action="/edit_department/{{ department.id }}" method="POST">
                        <div class="form-group">
                            <label for="name" class="form-label">Department Name</label>
                            <input type="text" id="name" name="name" class="form-control" value="{{ department.name }}" required>
                        </div>

                        <div class="form-group">
                            <label for="description" class="form-label">Description</label>
                            <textarea id="description" name="description" class="form-control" rows="3" required>{{ department.description }}</textarea>
                        </div>

                        <div class="form-group">
                            <label for="building" class="form-label">Building/Location</label>
                            <input type="text" id="building" name="building" class="form-control" value="{{ department.building }}" required>
                        </div>

                        <div class="form-group">
                            <label for="status" class="form-label">Status</label>
                            <select name="status" id="status" class="form-select" required>
                                <option value="active" {% if department.status == 'active' %}selected{% endif %}>Active</option>
                                <option value="closed" {% if department.status == 'closed' %}selected{% endif %}>Closed</option>
                                <option value="removed" {% if department.status == 'removed' %}selected{% endif %}>Removed</option>
                            </select>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-success flex-grow-1">Update Department</button>
                            <a href="/admin_dashboard" class="btn btn-secondary flex-grow-1">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
