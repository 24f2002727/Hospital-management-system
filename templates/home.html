{%extends "base.html" %}
{% block content %}
<body>
    <div>
        <div>
            <h1>Welcome to the Hospital Management System</h1>
            <img src="static/pexels-pixabay-40568.jpg" height="500px" width="100%vw">
        </div>
        <div class="container text-center">
            <p>Book a appointment or login </p>
            <div class="row">
                <div class="col">
                    
                </div>
                <div class="col">
                    <form action="/register" method="get">
                        <input type="submit" value="Register as new user" class="btn btn-success">
                    </form>
                </div>
                <div class="col">
                    <form action="/login" method="get">
                        <input type="submit" value="Login as existing user"
                            style=" padding: 10px 20px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer;">
                    </form>
                </div>
                <div class="col">
                    
                </div>   
            </div>
        </div>
    </div>


</body>

{% endblock %}
